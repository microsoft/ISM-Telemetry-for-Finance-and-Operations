on:
  pull_request:
  schedule:
    - cron: '45 2 * * *' # Daily at 2:45 AM UTC
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Select FSCM Version'
        required: false
        default: '*'

      includeTestModels:
        type: boolean
        default: false
        description: Include test models

permissions:
  contents: read

defaults:
  run:
    shell: pwsh
    
env:
  FORCE_COLOR: 3

jobs:
  Initialization:
    runs-on: [ windows-latest ]
    outputs:
      type: ${{ steps.ReadSettings.outputs.type }}
      source_branch: ${{ steps.ReadSettings.outputs.source_branch }}
      versions: ${{ steps.ReadSettings.outputs.VersionsJson }}
      environments: ${{ steps.ReadSettings.outputs.EnvironmentsJson }}
      githubRunner: ${{ steps.ReadSettings.outputs.GitHubRunnerJson }}
    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true
        
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize the workflow
        uses: fscpscollaborative/fscps.gh/WorkflowInitialize@953bb2a64548a8c19366e2edc999e6374a58abff # v2.1
        id: init
        env:
          secrets: ${{ toJson(secrets) }}    

      - name: Read settings
        id: ReadSettings
        uses: fscpscollaborative/fscps.gh/ReadSettings@953bb2a64548a8c19366e2edc999e6374a58abff # v2.1
        with:
          version: ${{ inputs.version }}

  Build:
    needs: [ Initialization ]
    runs-on: ${{ fromJson(needs.Initialization.outputs.githubRunner) }}
    strategy:
      matrix:
        version: ${{ fromJson(needs.Initialization.outputs.versions) }}
      fail-fast: false
    name: Build ${{ matrix.version }}
    permissions: 
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Read settings
        uses: fscpscollaborative/fscps.gh/ReadSettings@953bb2a64548a8c19366e2edc999e6374a58abff # v2.1
        with:
          version: ${{ matrix.version }}
          
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup NuGet
        uses: nuget/setup-nuget@b26b823c478ee115be5c9403e62c90b0bf943843 # v3.1.0
        with:
          nuget-version: 5.10.x

      
      - name: Copy Metadata folder
        run: |
          $src = "src/xpp/Metadata"
          $dst = "Metadata"
          if (Test-Path $src) {
            if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
            Copy-Item $src $dst -Recurse
          }
          
      - name: Run pipeline
        uses: fscpscollaborative/fscps.gh/RunPipeline@953bb2a64548a8c19366e2edc999e6374a58abff # v2.1
        id: runpipeline
        with:
          type: ${{ needs.Initialization.outputs.type}}
          version: ${{ matrix.version }}
          settingsJson: ${{ env.Settings }}
          secretsJson: ${{ env.RepoSecrets }}

      - name: Unzip package
        run: Expand-Archive -Path ${{ env.ARTIFACTS_PATH }}/*.zip -Destination ${{ env.ARTIFACTS_PATH }}/${{ env.PACKAGE_NAME }}
      
      - name: Publish artifacts  
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.ARTIFACTS_PATH }}/${{ env.PACKAGE_NAME }}

      - name: Add logs to job summary
        run: |
          $logFiles = Get-ChildItem -Path "${{ env.ARTIFACTS_PATH }}\Logs" -Recurse -Filter *.log
          $summary = "# Logs `n`n"
          if ($logFiles) {
              foreach ($logFile in $logFiles) {
                  $content = Get-Content -Path $logFile
                  $summary += "## $logFile `n"
                  foreach ($line in $content) {
                      # if the line consists only of = or - characters 
                      # (which would be interpreted as a setext heading 
                      # (https://github.github.com/gfm/#setext-headings)), 
                      # add a new line before it
                      if ($line -match "^[=-]+$") {
                          $summary += "`n$line`n"
                      } else {
                        $summary += $line + "`n"
                      } 
                  }
              }
          }
          $summary >> $env:GITHUB_STEP_SUMMARY
          
  PostProcess: 
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJson(needs.Initialization.outputs.githubRunner) }}
    needs: [ Initialization,  Build ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read settings
        uses: fscpscollaborative/fscps.gh/ReadSettings@953bb2a64548a8c19366e2edc999e6374a58abff # v2.1